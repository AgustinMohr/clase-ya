<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ClaseYa — encontrá profesores particulares por materia, modalidad y zona. Contactalos gratis."
    />
    <title>ClaseYa — Profesores particulares</title>
    <script>
      // Anti-flash: aplica el tema antes de pintar (localStorage → prefers-color-scheme).
      (function () {
        try {
          var stored = localStorage.getItem('claseya.theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
