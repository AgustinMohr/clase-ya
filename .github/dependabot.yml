# Dependabot configuration.
#
# Backend: Maven updates keep Spring Boot, Flyway, Testcontainers and plugins from freezing
# (see ADR-018). Spring Boot 4.x is a deliberate future migration; review major PRs separately.
#
# Frontend: Vite and its React plugin are versioned together: @vitejs/plugin-react 6.x requires
# vite ^8, so a Dependabot PR that bumps vite on its own leaves an incompatible tree
# (ERESOLVE on `npm install`). The groups below keep both packages in the same pull
# request, for version updates and for security updates.
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns:
          - "org.springframework*"
      testcontainers:
        patterns:
          - "org.testcontainers*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      vite-and-react:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
      vite-and-react-security:
        applies-to: "security-updates"
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
