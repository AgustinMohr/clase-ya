name: DB backup

# Daily encrypted pg_dump of the production database to a private R2 bucket (RT-04).
# The dump contains personal data: it is encrypted with age BEFORE leaving this job, the database
# role is read-only, and the bucket must stay private. Never print DATABASE_URL.
# Restore procedure: docs/runbooks/rollback-and-recovery.md (section 7).
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  dump:
    name: Dump, encrypt and upload
    # Pinned: ubuntu-latest moved to 26.04, whose repositories no longer ship the PostgreSQL clients we need.
    # 24.04 + the PGDG repo provide postgresql-client-18 (Neon runs PostgreSQL 18; pg_dump must be >=
    # the server major) and the preinstalled AWS CLI.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install PostgreSQL 18 client and age
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18 age
          /usr/lib/postgresql/18/bin/pg_dump --version
          aws --version

      - name: Dump, encrypt and upload
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          AGE_PUBLIC_KEY: ${{ secrets.AGE_PUBLIC_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          for name in DATABASE_URL AGE_PUBLIC_KEY AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET; do
            if [ -z "${!name}" ]; then
              echo "Missing secret for $name" >&2
              exit 1
            fi
          done

          FILE="claseya-$(date -u +%Y%m%dT%H%M%SZ).dump.age"

          echo "[1/3] pg_dump (max 10 min)"
          # --verbose prints object names to stderr, never row data.
          PGCONNECT_TIMEOUT=30 timeout 600 /usr/lib/postgresql/18/bin/pg_dump --verbose --format=custom             --no-owner --no-privileges --file=dump.raw "$DATABASE_URL"
          echo "Raw dump: $(stat -c%s dump.raw) bytes"

          echo "[2/3] encrypt"
          age -r "$AGE_PUBLIC_KEY" -o "$FILE" dump.raw
          rm -f dump.raw

          # A near-empty file means the dump failed silently; do not upload it as a good backup.
          SIZE=$(stat -c%s "$FILE")
          if [ "$SIZE" -lt 1000 ]; then
            echo "Backup file is suspiciously small ($SIZE bytes)" >&2
            exit 1
          fi

          echo "[3/3] upload to R2 (max 5 min)"
          timeout 300 aws s3 cp "$FILE" "s3://$R2_BUCKET/$FILE" --endpoint-url "$R2_ENDPOINT"             --cli-connect-timeout 30 --cli-read-timeout 120
          echo "Uploaded $FILE ($SIZE bytes)"
